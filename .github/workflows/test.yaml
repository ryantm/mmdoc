name: test

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = ca-derivations dynamic-derivations recursive-nix
            extra-system-features = recursive-nix ca-derivations
            allow-import-from-derivation = false
      - name: List flake structure
        run: nix flake show
      - name: Build and test
        run: |
          nix flake check -L
          nix build -L .#mmdoc-docs
          test -s result/multi/index.html
      - name: Lint
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: '.'
          extensions: 'h,c,cpp,hpp'
  test-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = ca-derivations dynamic-derivations recursive-nix
            extra-system-features = recursive-nix ca-derivations
            allow-import-from-derivation = false
      - name: Build and test
        run: |
          nix flake check -L
          nix build -L .#mmdoc-docs
          test -s result/multi/index.html
